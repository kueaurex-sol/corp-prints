<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Real four-color print screen angles: Cyan 15°, Magenta 75°, Yellow 0°, Key 45° -->
    <pattern id="dotsCyan" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="17" cy="17" r="7" fill="#00B8D9" fill-opacity="0.28"/>
    </pattern>
    <pattern id="dotsMagenta" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <circle cx="17" cy="17" r="6.5" fill="#E8368F" fill-opacity="0.24"/>
    </pattern>
    <pattern id="dotsYellow" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <circle cx="17" cy="17" r="7" fill="#FFC400" fill-opacity="0.28"/>
    </pattern>
    <pattern id="dotsKey" width="38" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="19" cy="19" r="4.5" fill="#14151A" fill-opacity="0.1"/>
    </pattern>

    <!-- Density fades in from bottom-left, builds up toward top-right (where the form card sits) -->
    <linearGradient id="density" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="45%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="1600" height="1200" fill="url(#density)"/>
    </mask>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <!-- Soft ink wash behind the dot screen, like pooled ink under the halftone -->
  <g filter="url(#soft)" style="mix-blend-mode:multiply">
    <circle cx="1250" cy="180" r="340" fill="#00B8D9" fill-opacity="0.16"/>
    <circle cx="1420" cy="520" r="300" fill="#E8368F" fill-opacity="0.14"/>
    <circle cx="1080" cy="560" r="280" fill="#FFC400" fill-opacity="0.18"/>
  </g>

  <!-- The four color-separation dot screens, each masked by the same density gradient -->
  <g mask="url(#fadeMask)" style="mix-blend-mode:multiply">
    <rect width="1600" height="1200" fill="url(#dotsCyan)"/>
    <rect width="1600" height="1200" fill="url(#dotsMagenta)"/>
    <rect width="1600" height="1200" fill="url(#dotsYellow)"/>
    <rect width="1600" height="1200" fill="url(#dotsKey)"/>
  </g>

  <!-- Print registration marks, like a printer uses to check plate alignment -->
  <g stroke="#14151A" fill="none" stroke-width="1.4">
    <g transform="translate(120,90)" stroke-opacity="0.18">
      <circle r="16"/><circle r="7.2"/>
      <line x1="-25.6" y1="0" x2="25.6" y2="0"/>
      <line x1="0" y1="-25.6" x2="0" y2="25.6"/>
    </g>
    <g transform="translate(1490,1100)" stroke-opacity="0.18">
      <circle r="16"/><circle r="7.2"/>
      <line x1="-25.6" y1="0" x2="25.6" y2="0"/>
      <line x1="0" y1="-25.6" x2="0" y2="25.6"/>
    </g>
    <g transform="translate(1460,130)" stroke-opacity="0.12">
      <circle r="12"/><circle r="5.4"/>
      <line x1="-19.2" y1="0" x2="19.2" y2="0"/>
      <line x1="0" y1="-19.2" x2="0" y2="19.2"/>
    </g>
  </g>
</svg>